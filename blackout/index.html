<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d17"><title>BLACKOUT NEXUS X</title><style>*{box-sizing:border-box}body{margin:0;background:#080d17;color:#eaf3fc;font:15px -apple-system,BlinkMacSystemFont,Arial}header{padding:24px 17px;background:linear-gradient(130deg,#142a42,#090d18);border-bottom:1px solid #274056}small{color:#60f1de;letter-spacing:2px}h1{font-size:27px;margin:9px 0 18px}nav{position:fixed;bottom:0;display:flex;width:100%;background:#0b1422;border-top:1px solid #294356;padding:10px 3px 22px}nav button{flex:1;background:transparent;color:#9caec3;border:0;font-size:12px;padding:8px 0}nav button.active{color:#60f1de;border-top:2px solid #60f1de}main{padding:14px 16px 100px;max-width:900px;margin:auto}.panel{border:1px solid #294154;border-radius:17px;background:#111d2e;margin:12px 0;padding:17px}.muted{color:#a8bbce}.big{font-size:30px;font-weight:800;color:#6cf4d7}.pill{display:inline-block;border:1px solid #345367;border-radius:18px;padding:7px 11px;color:#91dfea}.action{background:#5ce8d0;color:#08141b;border:0;border-radius:12px;padding:12px 17px;font-weight:800;margin:10px 0}h2{font-size:17px}p{line-height:1.55}article{white-space:pre-wrap}.warn{color:#ffc46d}</style></head><body><header><small>BLACKOUT • NEXUS X</small><h1>YM / MYM TERMINAL</h1><div class="pill" id="status">Connexion...</div><br><button class="action" onclick="load()">↻ Actualiser</button></header><main id="content"></main><nav id="tabs"></nav><script>const pages=['VUE','MACRO','GÉO','MARCHÉ','PLAN'];let tab=0,data={};const E=x=>String(x??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const panel=(title,body)=>'<section class="panel"><h2>'+E(title)+'</h2>'+body+'</section>';const showList=v=>Array.isArray(v)?(v.length?v.map(x=>panel(x.title||x.name||x.symbol||'Information','<article>'+E(x.text||x.summary||x.description||x.value||JSON.stringify(x))+'</article>')).join(''):panel('En attente','Aucune donnée récente vérifiée')):panel('Informations','<article>'+E(typeof v==='object'?JSON.stringify(v,null,2):v)+'</article>');function render(){document.getElementById('tabs').innerHTML=pages.map((p,i)=>'<button class="'+(i===tab?'active':'')+'" onclick="tab='+i+';render()">'+p+'</button>').join('');const s=data.snapshot||{},v=data.view||{};document.getElementById('status').textContent=s.status||'NON ACTUALISÉ';let out='';if(tab===0)out=panel('VERDICT','<div class="big">'+E(v.verdict||'ATTENTE')+'</div><p>'+E(v.verdictReason||v.biasReason||'Aucune analyse récente vérifiée')+'</p><div class="muted">'+E(s.dateLabel||'')+'</div>')+panel('BIAIS MACRO','<div class="big">'+E(v.bias||'NON ACTUALISÉ')+'</div><p>'+E(v.biasReason||'')+'</p>')+panel('MARCHÉS',showList(data.quotes||[]));if(tab===1)out=showList(data.macro||data.macroCards||data.events||[]);if(tab===2)out=showList(data.geo||data.geopolitics||[]);if(tab===3)out=showList(data.market||data.dow30||data.quotes||[]);if(tab===4)out=showList(data.plan||data.plans||data.scenarios||[]);document.getElementById('content').innerHTML=out+panel('FRAÎCHEUR & SOURCES','<p class="warn">'+E(s.freshness||'Données non vérifiées en direct')+'</p><p class="muted">Mise à jour : '+E(data._updated_at||'inconnue')+'</p>')}async function load(){document.getElementById('status').textContent='CHARGEMENT';try{const r=await fetch('https://lsfqjttyjxqksrfuspgp.supabase.co/rest/v1/blackout_snapshots?id=eq.latest&select=payload%2Cupdated_at',{headers:{apikey:'sb_publishable_IPaZbe0d9nLb0o_bUXaI-g_XSmQMKOh'}});if(!r.ok)throw Error('HTTP '+r.status);const a=await r.json();if(!a.length)throw Error('Aucun relevé');data={...a[0].payload,_updated_at:a[0].updated_at};render()}catch(e){document.getElementById('status').textContent='HORS LIGNE';document.getElementById('content').innerHTML=panel('Connexion impossible',E(e.message))}}load()</script></body></html>
